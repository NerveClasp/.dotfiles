# `dotfiles` to be deployed
dotfiles:
  # Relative path in `dotfiles/`
  - path: base/user
    overwrite_target: "$HOME/.config/nvim/lua/user"
    merge: Overwrite
    # Optional: Whether this file is a template or not (skips template actions (replace, ..) if not)
    # Default: true
    template: false
  - path: base/fish
    overwrite_target: "$HOME/.config/fish"
    merge: Overwrite
    template: false
  - path: base/omf
    overwrite_target: "$HOME/.config/omf"
    merge: Overwrite
    template: false
  - path: base/wezterm
    overwrite_target: "$HOME/.config/wezterm"
    merge: Overwrite
    template: false
# Symlinks to be created
# links:
# Absolute path to target of the link
# - source_path: "$HOME/configurations"
#   # Absolute path to the source of the link
#   target_path: "~/.config"
#   # Optional: Will replace existing symlink at target (overwrite). But only if the file at the target is a symlink.
#   # Default: true
#   replace: false
